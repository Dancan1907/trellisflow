# ============================================================================
# TrellisFlow — Continuous Integration
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trellisflow/api exec prisma generate

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trellisflow/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trellisflow/api exec prisma generate

      - name: Build
        run: pnpm build

  # ==========================================================================
  # Unit tests — fast. Run on every push and PR.
  # Runs the service-level specs + the audit controller specs.
  # ==========================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trellisflow/api exec prisma generate

      - name: Run unit tests with coverage
        run: pnpm --filter @trellisflow/api test:unit --coverage
        # Note: The "test:unit" script ignores integration.spec.ts files.
        # Coverage thresholds (configured in apps/api/jest.config.js) still apply.
        # NODE_ENV=test ensures EmailService bypasses Resend during tests.

  # ==========================================================================
  # Integration + E2E tests — slower. Requires a real PostgreSQL database.
  # We spin one up as a service container so the tests can hit a real DB
  # exactly like they do locally.
  # ==========================================================================
  test-integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trellisflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both DATABASE_URL and TEST_DATABASE_URL point at the same
      # CI Postgres container. This matches our jest setup which
      # overrides DATABASE_URL with TEST_DATABASE_URL.
      DATABASE_URL: postgresql://test:test@localhost:5432/trellisflow_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trellisflow_test
      DIRECT_URL: postgresql://test:test@localhost:5432/trellisflow_test
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-do-not-use-in-prod
      NODE_ENV: test
      RESEND_API_KEY: re_dummy_key_for_ci
      PORT: 3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @trellisflow/api exec prisma generate

      - name: Run migrations
        run: pnpm --filter @trellisflow/api exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm --filter @trellisflow/api test:integration

      - name: Run E2E tests
        run: pnpm --filter @trellisflow/api test:e2e
