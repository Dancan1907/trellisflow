<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verify your email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 40px 0;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    
    <!-- Header -->
    <div style="background-color: #10b981; padding: 24px; text-align: center;">
      <h1 style="color: #ffffff; margin: 0; font-size: 24px;">TrellisFlow</h1>
    </div>

    <!-- Body -->
    <div style="padding: 32px;">
      <h2 style="color: #111827; margin-top: 0;">Verify your email address</h2>
      <p style="color: #4b5563; line-height: 1.6;">Welcome to TrellisFlow! Please use the verification token below to activate your account.</p>
      
      <div style="background-color: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; text-align: center; margin: 24px 0;">
        <code style="font-family: monospace; font-size: 16px; color: #111827; letter-spacing: 1px;">{{token}}</code>
      </div>

      <p style="color: #6b7280; font-size: 14px;">This token will expire in 24 hours.</p>
      <p style="color: #6b7280; font-size: 14px;">If you didn't create an account, you can safely ignore this email.</p>
    </div>

    <!-- Footer -->
    <div style="background-color: #f9fafb; padding: 16px; text-align: center; border-top: 1px solid #e5e7eb;">
      <p style="color: #9ca3af; font-size: 12px; margin: 0;">&copy; 2026 TrellisFlow. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
